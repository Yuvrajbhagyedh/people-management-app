<div class="container">
  <div class="header-section">
    <h1>{{ isEditMode ? 'Edit Person' : 'Add New Person' }}</h1>
    <button class="btn btn-secondary" (click)="cancel()">Back to List</button>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <div *ngIf="loading && !isEditMode" class="loading">
    Processing...
  </div>

  <form [formGroup]="personForm" (ngSubmit)="onSubmit()" *ngIf="!loading || isEditMode">
    <div class="form-group">
      <label for="name">Name *</label>
      <input 
        type="text" 
        id="name" 
        formControlName="name" 
        class="form-control"
        [class.error]="name?.invalid && name?.touched">
      <div *ngIf="name?.invalid && name?.touched" class="error-message">
        <div *ngIf="name?.errors?.['required']">Name is required</div>
        <div *ngIf="name?.errors?.['minlength']">Name must be at least 2 characters</div>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email *</label>
      <input 
        type="email" 
        id="email" 
        formControlName="email" 
        class="form-control"
        [class.error]="email?.invalid && email?.touched">
      <div *ngIf="email?.invalid && email?.touched" class="error-message">
        <div *ngIf="email?.errors?.['required']">Email is required</div>
        <div *ngIf="email?.errors?.['email']">Please enter a valid email address</div>
      </div>
    </div>

    <div class="form-group">
      <label for="phone">Phone</label>
      <input 
        type="text" 
        id="phone" 
        formControlName="phone" 
        class="form-control">
    </div>

    <div class="form-group">
      <label for="age">Age</label>
      <input 
        type="number" 
        id="age" 
        formControlName="age" 
        class="form-control"
        min="0">
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <textarea 
        id="address" 
        formControlName="address" 
        class="form-control"
        rows="3"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-success" [disabled]="loading || personForm.invalid">
        {{ isEditMode ? 'Update Person' : 'Create Person' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
